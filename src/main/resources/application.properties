server.port=8081

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=notification-service-group

spring.kafka.consumer.auto-offset-reset=latest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties[spring.json.value.default.type]=org.example.notification.dto.UserEvent

spring.kafka.consumer.properties[spring.json.use.type.headers]=false

spring.kafka.consumer.properties[spring.json.trusted.packages]=org.example.notification.dto

spring.mail.host=localhost

spring.mail.port=1025

spring.mail.properties.mail.smtp.auth=false

spring.mail.properties.mail.smtp.starttls.enable=false
